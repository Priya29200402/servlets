<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            background-image:url("https://images.unsplash.com/photo-1529101091764-c3526daf38fe?auto=format&fit=crop&w=1600&q=80");

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;

        }

        .navbar{

            background: black;

        }

        .navbar-brand{

            font-size:28px;
            font-weight;

        }

        .nav-link{

            color:white !important;
            font-weight:bold;

        }

        .nav-link:hover{

            color:yellow !important;

        }

        .form-card{

            margin-top:50px;
            margin-bottom:50px;

            background:rgba(255,255,255,.92);

            border-radius:20px;

            padding:35px;

            box-shadow:0px 10px 30px rgba(0,0,0,.25);

            transition:.4s;

        }

        .form-card:hover{

            transform:translateY(-5px);

        }

        h2{

            text-align:center;

            color:black;

            margin-bottom:30px;

            font-weight:bold;

        }

        label{

            font-weight:bold;

            margin-bottom:5px;

        }

        .form-control,
        .form-select{

            border-radius:10px;

        }

        .btn-primary{

            width:100%;

            font-size:18px;

            border-radius:30px;

        }

        footer{

            text-align:center;

            color;

            font-weight:bold;

            margin-top:20px;
            padding-bottom:20px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">

            Smart Service Portal

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="vehicle.html">Vehicle</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="event.html">Event</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="hotel.html">Hotel</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="recipe.html">Recipe</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="travel.html">Travel</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="form-card">

                <h2>Event Registration</h2>

                <form action="event" method="post">

                    <div class="mb-3">

                        <label>Event Name</label>

                        <input
                                type="text"
                                name="eventName"
                                class="form-control"
                                placeholder="Enter Event Name"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Organizer Name</label>

                        <input
                                type="text"
                                name="organizerName"
                                class="form-control"
                                placeholder="Enter Organizer Name"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Event Date</label>

                        <input
                                type="date"
                                name="eventDate"
                                class="form-control"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Venue</label>

                        <input
                                type="text"
                                name="venue"
                                class="form-control"
                                placeholder="Enter Venue"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Capacity</label>

                        <input
                                type="number"
                                name="capacity"
                                class="form-control"
                                placeholder="Enter Capacity"
                                required>

                    </div>

                    <div class="mb-4">

                        <label>Registration Fee</label>

                        <input
                                type="number"
                                step="0.01"
                                name="fee"
                                class="form-control"
                                placeholder="Enter Registration Fee"
                                required>

                    </div>

                    <button
                            type="submit"
                            class="btn btn-dark">
                         Register Event

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<footer>

    <h5>Smart Service Portal</h5>

    <p>Event Registration System</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
