<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            background-image:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80");

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;

        }

        .navbar{

            background: black;

        }

        .navbar-brand{

            font-size:28px;
            font-weight;

        }

        .nav-link{

            color:white !important;
            font-weight:bold;

        }

        .nav-link:hover{

            color:yellow !important;

        }

        .form-card{

            margin-top:50px;
            margin-bottom:50px;

            background:rgba(255,255,255,.92);

            border-radius:20px;

            padding:35px;

            box-shadow:0px 10px 30px rgba(0,0,0,.25);

            transition:.4s;

        }

        .form-card:hover{

            transform:translateY(-5px);

        }

        h2{

            text-align:center;

            color:black;

            margin-bottom:30px;

            font-weight:bold;

        }

        label{

            font-weight:bold;

            margin-bottom:5px;

        }

        .form-control,
        .form-select{

            border-radius:10px;

        }

        .btn-primary{

            width:100%;

            font-size:18px;

            border-radius:30px;

        }

        footer{

            text-align:center;

            color;

            font-weight:bold;

            margin-top:20px;
            padding-bottom:20px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">

            Smart Service Portal

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="#menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="vehicle.html">Vehicle</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="event.html">Event</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="hotel.html">Hotel</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="recipe.html">Recipe</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="travel.html">Travel</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="form-card">

                <h2>Recipe Management</h2>

                <form action="recipe" method="post">

                    <div class="mb-3">

                        <label>Recipe Name</label>

                        <input
                                type="text"
                                name="recipeName"
                                class="form-control"
                                placeholder="Enter Recipe Name"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Cuisine Type</label>

                        <input
                                type="text"
                                name="cuisineType"
                                class="form-control"
                                placeholder="Enter Cuisine Type"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Cooking Time (Minutes)</label>

                        <input
                                type="number"
                                name="cookingTime"
                                class="form-control"
                                placeholder="Enter Cooking Time"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Difficulty Level</label>

                        <select
                                name="difficulty"
                                class="form-select"
                                required>

                            <option value="">Select Difficulty</option>
                            <option>Easy</option>
                            <option>Medium</option>
                            <option>Hard</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label>Ingredients Count</label>

                        <input
                                type="number"
                                name="ingredients"
                                class="form-control"
                                placeholder="Enter Ingredients Count"
                                required>

                    </div>

                    <div class="mb-4">

                        <label>Calories</label>

                        <input
                                type="number"
                                name="calories"
                                class="form-control"
                                placeholder="Enter Calories"
                                required>

                    </div>

                    <button
                            type="submit"
                            class="btn btn-dark">
                         Add Recipe

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<footer>

    <h5>Smart Service Portal</h5>

    <p>Recipe Management System</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
