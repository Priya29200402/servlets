<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            background-image:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80");

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;

        }

        .navbar{

            background: black;

        }

        .navbar-brand{

            font-size:28px;
            font-weight;

        }

        .nav-link{

            color:white !important;
            font-weight:bold;

        }

        .nav-link:hover{

            color:yellow !important;

        }

        .form-card{

            margin-top:50px;
            margin-bottom:50px;

            background:rgba(255,255,255,.92);

            border-radius:20px;

            padding:35px;

            box-shadow:0px 10px 30px rgba(0,0,0,.25);

            transition:.4s;

        }

        .form-card:hover{

            transform:translateY(-5px);

        }

        h2{

            text-align:center;

            color:black;

            margin-bottom:30px;

            font-weight:bold;

        }

        label{

            font-weight:bold;

            margin-bottom:5px;

        }

        .form-control,
        .form-select{

            border-radius:10px;

        }

        .btn-primary{

            width:100%;

            font-size:18px;

            border-radius:30px;

        }

        footer{

            text-align:center;

            color: wight bold;

            font-weight:bold;

            margin-top:20px;
            padding-bottom:20px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">

            Smart Service Portal

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="vehicle.html">Vehicle</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="event.html">Event</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="hotel.html">Hotel</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="recipe.html">Recipe</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="travel.html">Travel</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="form-card">

                <h2>Vehicle Registration</h2>

                <form action="vehicle" method="post">

                    <div class="mb-3">

                        <label>Owner Name</label>

                        <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter Owner Name"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Vehicle Number</label>

                        <input
                                type="text"
                                name="number"
                                class="form-control"
                                placeholder="KA01AB1234"
                                required>

                    </div>

                    <div class="mb-3">

                        <label>Vehicle Type</label>

                        <select
                                name="type"
                                class="form-select"
                                required>

                            <option value="">Select Vehicle Type</option>

                            <option>Car</option>

                            <option>Bike</option>

                            <option>Bus</option>

                            <option>Truck</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label>Registration Date</label>

                        <input
                                type="date"
                                name="date"
                                class="form-control"
                                required>

                    </div>
                    <div class="mb-3">

                        <label>Insurance Valid Till</label>

                        <input
                                type="date"
                                name="insurance"
                                class="form-control"
                                required>

                    </div>

                    <div class="mb-4">

                        <label>Fuel Type</label>

                        <select
                                name="fuel"
                                class="form-select"
                                required>

                            <option value="">Select Fuel Type</option>

                            <option>Petrol</option>

                            <option>Diesel</option>

                            <option>Electric</option>

                            <option>CNG</option>

                        </select>

                    </div>

                    <button
                            type="submit"
                            class="btn btn-dark" style="float: center;">
                         Register Vehicle

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<footer>

    <h5>Smart Service Portal</h5>

    <p>Vehicle Registration System</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const params = new URLSearchParams(window.location.search);

    if(params.get("success")=="true"){

        var modal = new bootstrap.Modal(
            document.getElementById('successModal')
        );

        modal.show();

    }

</script>

<div class="modal fade" id="successModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">
                    Success
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body text-center">

                <h4>✅ Vehicle Registered Successfully!</h4>

            </div>

            <div class="modal-footer">

                <button class="btn btn-success"
                        data-bs-dismiss="modal">

                    OK

                </button>

            </div>

        </div>

    </div>

</div>

</body>

</html>
