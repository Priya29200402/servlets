<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Registration Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<h1>Vehicle Registration Page</h1>
<form action="vehicle" method="post">
    Ower Name: <input type="text" name="name" placeholder="Enter Vehicle Name">
    Vehicle Number: <input type="text" name="number" placeholder="Enter Vehicle Number">
    Vehicle Type: <input type="text" name="type" placeholder="Enter Vehicle Type">
    Registration Date: <input type="date" name="date">
    Insurence Valid Till: <input type="text" name="insurance" placeholder="Enter Insurance Company">
    Fuel Type: <input type="text" name="fuel" placeholder="Enter Fuel Type">
    <input type="submit" value="Register">

</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
